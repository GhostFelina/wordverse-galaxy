name: Feature idea
description: Suggest a focused improvement to learning or exploration.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help someone do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
