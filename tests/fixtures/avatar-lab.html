<!doctype html>
<html lang="tr">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wordverse avatar istemci doğrulaması</title>
  <style>
    body {
      font: 16px/1.5 system-ui;
      max-width: 760px;
      margin: 32px auto;
      padding: 0 20px;
      background: #101522;
      color: #e8edf8;
    }
    button {
      font: inherit;
      padding: 12px 18px;
      cursor: pointer;
    }
    li {
      padding: 7px 0;
      overflow-wrap: anywhere;
    }
    #state {
      padding: 12px;
      border: 1px solid #6a7894;
    }
    img {
      width: 64px;
      height: 64px;
      border: 1px solid #6a7894;
      image-rendering: pixelated;
    }
    button:focus-visible {
      outline: 3px solid #c1d4ff;
      outline-offset: 4px;
    }
  </style>
  <h1>Avatar istemci doğrulaması</h1>
  <p>
    Gerçek Supabase SDK ile yalnız bellekteki sahte API kullanılır. Oturum, kullanıcı kayıtları ve bulut bucket
    değiştirilmez. Bu kontrol gerçek Storage/RLS kabulü değildir.
  </p>
  <button id="run">Yükleme, değiştirme ve kaldırmayı doğrula</button>
  <p id="state" role="status" aria-live="polite">Hazır</p>
  <img id="preview" alt="İndirilen örnek avatar" hidden />
  <ol id="steps"></ol>
  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    import { uploadAvatar, downloadAvatar, removeAvatar, AVATAR_MAX_BYTES } from '/src/avatar-storage.ts';
    const owner = '11111111-1111-4111-8111-111111111111';
    const other = '22222222-2222-4222-8222-222222222222';
    const state = document.querySelector('#state');
    const steps = document.querySelector('#steps');
    const image = document.querySelector('#preview');
    let objectUrl;
    function assert(value, message) {
      if (!value) throw new Error(message);
    }
    function step(text) {
      const item = document.createElement('li');
      item.textContent = text;
      steps.append(item);
    }
    async function reject(operation, code) {
      try {
        await operation;
        throw new Error('Beklenen ret alınmadı');
      } catch (error) {
        assert(error.code === code, 'Yanlış hata kodu');
      }
    }
    async function png(color) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 32;
      const context = canvas.getContext('2d');
      context.fillStyle = color;
      context.fillRect(0, 0, 32, 32);
      return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    }
    const json = (body, status = 200) =>
      new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
    document.querySelector('#run').addEventListener('click', async (event) => {
      event.target.disabled = true;
      steps.replaceChildren();
      image.hidden = true;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      const objects = new Map();
      let writes = 0;
      const transport = async (input, init) => {
        const request = new Request(input, init);
        const url = new URL(request.url);
        assert(url.origin === 'https://avatar-storage.test', 'Gerçek ağ hedefi engellendi');
        if (url.pathname === '/auth/v1/user')
          return json({ id: owner, aud: 'authenticated', email: 'avatar@example.test' });
        const root = '/storage/v1/object/wordverse-avatars/';
        const readRoot = root;
        if (request.method === 'POST' && url.pathname.startsWith(root)) {
          const key = decodeURIComponent(url.pathname.slice(root.length));
          const fields = await request.formData();
          const file = [...fields.values()].find((value) => value instanceof Blob);
          if (!file || !['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > AVATAR_MAX_BYTES)
            return json({ message: 'Test bucket restriction', statusCode: '400' }, 400);
          if (!key.startsWith(`${owner}/`)) return json({ message: 'Test owner isolation', statusCode: '403' }, 403);
          if (objects.has(key) && request.headers.get('x-upsert') !== 'true')
            return json({ message: 'Test duplicate', statusCode: '409' }, 409);
          objects.set(key, file);
          writes++;
          return json({ Key: `wordverse-avatars/${key}`, Id: 'test-object' });
        }
        if (request.method === 'GET' && url.pathname.startsWith(readRoot)) {
          const key = decodeURIComponent(url.pathname.slice(readRoot.length));
          const file = objects.get(key);
          return file
            ? new Response(file, { headers: { 'Content-Type': file.type } })
            : json({ message: 'Test missing', statusCode: '404' }, 404);
        }
        if (request.method === 'DELETE' && url.pathname === '/storage/v1/object/wordverse-avatars') {
          const { prefixes } = await request.json();
          assert(prefixes.length === 1 && prefixes[0].startsWith(`${owner}/`), 'Toplu/yabancı silme engellendi');
          prefixes.forEach((key) => objects.delete(key));
          return json(prefixes.map((name) => ({ name })));
        }
        throw new Error('Beklenmeyen sahte API isteği');
      };
      const client = createClient('https://avatar-storage.test', 'sb_publishable_fixture_only', {
        global: { fetch: transport },
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
      try {
        state.textContent = 'Kontrol sürüyor';
        const token = [
          btoa(JSON.stringify({ alg: 'HS256' })),
          btoa(JSON.stringify({ sub: owner, exp: Math.floor(Date.now() / 1000) + 3600 })),
          'fixture-only-signature',
        ].join('.');
        const session = await client.auth.setSession({ access_token: token, refresh_token: 'fixture-only-refresh' });
        assert(!session.error, 'Sahte SDK oturumu kurulamadı');
        const first = await png('#9ec5ff');
        const path = await uploadAvatar(client, owner, first);
        assert(objects.size === 1, 'Yükleme kaydı yok');
        step('Yeni avatar yalnız sahip klasörüne yüklendi.');
        const second = await png('#bdd7a6');
        await uploadAvatar(client, owner, second, path);
        assert(objects.size === 1 && writes === 2, 'Upsert yeni kopya oluşturdu');
        step('Upsert aynı dosyayı değiştirdi; fazladan kayıt oluşmadı.');
        const downloaded = await downloadAvatar(client, owner, path);
        assert((await downloaded.text()) === (await second.text()), 'İndirilen içerik farklı');
        objectUrl = URL.createObjectURL(downloaded);
        image.src = objectUrl;
        await image.decode();
        image.hidden = false;
        step('Özel avatar kimliği doğrulanmış indirme ile okundu ve çözümlendi.');
        await reject(uploadAvatar(client, owner, new Blob(['<svg/>'], { type: 'image/svg+xml' })), 'file-type');
        await reject(uploadAvatar(client, owner, new Blob(['fake png'], { type: 'image/png' })), 'file-content');
        await reject(
          uploadAvatar(client, owner, new Blob([new Uint8Array(AVATAR_MAX_BYTES + 1)], { type: 'image/png' })),
          'file-size',
        );
        assert(writes === 2, 'Geçersiz dosya gönderildi');
        step('SVG, sahte PNG ve 2 MiB üstü dosya ağ yazmadan reddedildi.');
        await reject(downloadAvatar(client, other, path), 'invalid-path');
        await reject(removeAvatar(client, other, path), 'invalid-path');
        assert(objects.size === 1, 'Yabancı sahip dosyayı etkiledi');
        step('Başka sahip adına okuma/kaldırma istemcide engellendi.');
        await removeAvatar(client, owner, path);
        assert(objects.size === 0, 'Sahte fixture kaldırılmadı');
        step('Yalnız örnek avatar kaldırıldı; bellekte kalan fixture yok.');
        state.textContent = 'İstemci kontrolü geçti · gerçek Storage kabulü bekliyor';
      } catch (error) {
        state.textContent = `Kontrol başarısız: ${error.code || error.message}`;
      } finally {
        event.target.disabled = false;
      }
    });
    window.addEventListener('pagehide', () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    });
  </script>
</html>
